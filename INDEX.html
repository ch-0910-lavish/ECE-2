<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Display</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="product-card">
    <h1>My E-commerce Store</h1>
    <img src="phone.jpg" alt="Stylish phone" class="product-image">
    <h2>S25 ULTRA</h2>
    <b><p class="description"> The best and most powerful phone around.</p></b>
    <p class="price">Price: ₹13499</p>
    <button class="add-to-cart">Add to Cart</button>
  </div>
</body>
</html>
